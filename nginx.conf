server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MIME types - ensure CSS and JS are properly recognized
    include /etc/nginx/mime.types;
    types {
        text/css css;
        application/javascript js;
        application/json json;
    }
    default_type application/octet-stream;

    # CSS files - regex location catches all .css files including in /assets/
    location ~* \.css$ {
        add_header Content-Type text/css always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # JavaScript files
    location ~* \.js$ {
        add_header Content-Type application/javascript always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # Serve static assets (images, fonts, etc.)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # Vue.js SPA routing - redirect all routes to index.html
    # This must come after static asset locations
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}
