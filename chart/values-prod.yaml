# Production values for devops-frontend
# This file contains production-specific overrides

image:
  repository: registry.gitlab.cs.ut.ee/devops/teams/emzops/devops-fe
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: gitlab-registry-secret

# Production: Higher replica count for availability
replicaCount: 2

service:
  type: ClusterIP
  port: 80

resources:
  # Production: Higher resource limits
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

config:
  apiUrl: "/api"
  wsUrl: "/ws"

ingress:
  enabled: true
  className: nginx
  host: devops-mezdit-prod.kubernetes.devops.cs.ut.ee  # Different host for production to avoid conflict with staging
  tls:
    enabled: true
    secretName: backend-tls-cert
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/websocket-services: "devops-backend-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

backend:
  serviceName: devops-backend-service
  port: 80

# Production: Enable autoscaling
# Configured for easy demonstration (low thresholds)
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 30  # Low threshold for easy demo
  targetMemoryUtilizationPercentage: 50  # Low threshold for easy demo

# Production: Affinity constraints
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - devops-frontend
        topologyKey: kubernetes.io/hostname

