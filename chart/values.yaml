image:
  repository: registry.gitlab.cs.ut.ee/devops/teams/emzops/devops-be
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: gitlab-registry-secret

serviceInfo:
  port: 8080
  metricsPort: 9090

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

storage:
  images:
    size: 2Gi
    className: longhorn

postgres:
  image: postgres:15-alpine
  dbName: devops
  storage:
    size: 1Gi
    className: longhorn

secrets:
  backend:
    databaseUrl: ""
  postgres:
    username: ""
    password: ""
