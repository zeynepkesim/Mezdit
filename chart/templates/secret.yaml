apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  DATABASE_URL: {{ .Values.secrets.backend.databaseUrl | b64enc | quote }}
  MINIO_ENDPOINT: {{ .Values.secrets.backend.minioEndpoint | b64enc | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.backend.minioAccessKey | b64enc | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.backend.minioSecretKey | b64enc | quote }}
  MINIO_BUCKET_NAME: {{ .Values.secrets.backend.minioBucketName | b64enc | quote }}
  MINIO_USE_SSL: {{ .Values.secrets.backend.minioUseSSL | b64enc | quote }}
