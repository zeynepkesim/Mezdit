apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: {{ .Release.Name }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-minio
spec:
  # Use single server configuration to avoid double replication
  # Since longhorn already provides 3 replicas
  pools:
    - servers: 1
      name: pool-0
      volumesPerServer: 1
      volumeClaimTemplate:
        metadata:
          name: data
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: {{ .Values.minio.storageClassName }}
          resources:
            requests:
              storage: {{ .Values.minio.storage.size }}

  # MinIO credentials from secrets
  configuration:
    name: {{ .Release.Name }}-minio-env-config

  # Resource limits
  resources:
    requests:
      cpu: {{ .Values.minio.resources.requests.cpu }}
      memory: {{ .Values.minio.resources.requests.memory }}
    limits:
      cpu: {{ .Values.minio.resources.limits.cpu }}
      memory: {{ .Values.minio.resources.limits.memory }}
