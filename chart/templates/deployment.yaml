apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      imagePullSecrets:
{{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
{{- end }}
      containers:
      - name: backend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.serviceInfo.port }}
          name: http
        - containerPort: {{ .Values.serviceInfo.metricsPort }}
          name: metrics
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.serviceInfo.port }}
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.serviceInfo.port }}
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 10
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: PORT
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secret
              key: DATABASE_URL
        - name: MINIO_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secret
              key: MINIO_ENDPOINT
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secret
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secret
              key: MINIO_SECRET_KEY
        - name: MINIO_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secret
              key: MINIO_BUCKET_NAME
        - name: MINIO_USE_SSL
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secret
              key: MINIO_USE_SSL
