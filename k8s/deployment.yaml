apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-backend
  namespace: emzops-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-backend
  template:
    metadata:
      labels:
        app: devops-backend
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
      - name: backend
        image: registry.gitlab.cs.ut.ee/devops/teams/emzops/devops-be:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: PORT
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DATABASE_URL
