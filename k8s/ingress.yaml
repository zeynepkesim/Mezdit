apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-backend-ingress
  namespace: emzops-staging
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # WebSocket support - critical for WebSocket upgrade
    nginx.ingress.kubernetes.io/websocket-services: "devops-backend-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - devops-mezdit.kubernetes.devops.cs.ut.ee
    secretName: backend-tls-cert
  rules:
  - host: devops-mezdit.kubernetes.devops.cs.ut.ee
    http:
      paths:
      # WebSocket - MUST be first to avoid being caught by /api regex
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: devops-backend-service
            port:
              number: 80
      # Backend API - /api path rewrites to / via configuration-snippet
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: devops-backend-service
            port:
              number: 80
      # Frontend - Root path (MUST be last)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devops-frontend-service
            port:
              number: 80
