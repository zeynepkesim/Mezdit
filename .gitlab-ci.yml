image: golang:latest
stages:
  - security
  - test
  - build
  - deploy

# Security: Secrets Detection
# Scans code for accidentally committed secrets, API keys, passwords, etc.
secrets-detection:
  stage: security
  image: zricethezav/gitleaks:latest
  script:
    - echo "🔍 Scanning for secrets in codebase..."
    - gitleaks detect --source . --verbose --no-git --redact
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^(develop|staging)$/'
  tags: []

format:
  stage: test
  script:
    - go fmt $(go list ./... | grep -v /vendor/)
    - go vet $(go list ./... | grep -v /vendor/)
test:
  stage: test
  services:
    - postgres:latest
  variables:
    POSTGRES_DB: postgres
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ""
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: "postgres://postgres@postgres:5432/postgres?sslmode=disable"
  script:
    - go test -v -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
    - COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
    - echo "Coverage is $COVERAGE"
  coverage: '/Coverage is (\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week
compile:
  stage: build
  script:
    - mkdir -p mybinaries
    - go build -o mybinaries ./...
  artifacts:
    paths:
      - mybinaries
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    # Install SSH client and dependencies
    - apk update && apk add openssh-client bash
    # Setup SSH
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Add SSH private key (from GitLab CI/CD variable)
    # Note: SSH_PRIVATE_KEY is a protected GitLab CI/CD variable - never logged
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    # Add VM to known hosts (disable host key checking for first connection)
    - ssh-keyscan -H $VM_HOST >> ~/.ssh/known_hosts || echo "StrictHostKeyChecking no" >> ~/.ssh/config
    - echo "✅ SSH configured securely (key not logged)"
  script:
    # Copy the compiled binary to VM
    - scp mybinaries/devops-be $VM_USER@$VM_HOST:/home/$VM_USER/devops-be-new
    # SSH into VM and deploy
    - |
      ssh $VM_USER@$VM_HOST << EOF
        set -e  # Exit on any error
        # Stop the service
        echo "Stopping service..."
        sudo systemctl stop devops-be || true
        # Replace old binary with new one
        echo "Moving new binary..."
        sudo mv /home/centos/devops-be-new /usr/local/bin/devops-be
        sudo chmod +x /usr/local/bin/devops-be
        # Fix SELinux context
        echo "Fixing SELinux context..."
        sudo chcon -t bin_t /usr/local/bin/devops-be
        # Verify binary exists and is executable
        if [ ! -x /usr/local/bin/devops-be ]; then
          echo "❌ Binary not found or not executable!"
          exit 1
        fi
        # Start the service
        echo "Starting service..."
        sudo systemctl start devops-be
        # Wait a moment for service to start
        sleep 2
        # Check if service actually started
        if ! sudo systemctl is-active --quiet devops-be; then
          echo "❌ Service failed to start!"
          echo "Service status:"
          sudo systemctl status devops-be || true
          echo "Recent logs:"
          sudo journalctl -u devops-be -n 50 --no-pager
          exit 1
        fi
        # Show service status
        sudo systemctl status devops-be
        echo "✅ Deployment completed successfully!"
      EOF
  environment:
    name: production
    url: http://$VM_HOST:8080
  only:
    - main
  dependencies:
    - compile
