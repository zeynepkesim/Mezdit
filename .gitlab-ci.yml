image: node:22-alpine

stages:
  - security
  - build
  - build-image  # YENİ STAGE
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# Security: Secrets Detection
secrets-detection:
  stage: security
  image: zricethezav/gitleaks:latest
  script:
    - echo "Scanning for secrets in frontend code..."
    - gitleaks detect --source . --verbose --no-git --redact
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: "$CI_COMMIT_BRANCH =~ /^(develop|staging)$/"
  tags: []

cache:
  paths:
    - node_modules/

build:
  stage: build
  script:
    - echo "Installing dependencies..."
    - npm ci
    - echo "Building application..."
    - npm run build
    - echo "Build completed successfully!"
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main

# YENİ: Container Image Build Stage
build-docker-image:
  stage: build-image
  image: quay.io/buildah/stable:latest
  before_script:
    - buildah login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building frontend container image..."
    - buildah bud -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
    - echo "Pushing to GitLab Container Registry..."
    - buildah push $IMAGE_NAME:$IMAGE_TAG
    - buildah push $IMAGE_NAME:latest
    - echo "✅ Frontend image pushed: $IMAGE_NAME:latest"
  only:
    - main

# VM deployment (şimdilik kalabilir, Week 10'da kaldırılacak)
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk update && apk add openssh-client bash rsync
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $VM_HOST >> ~/.ssh/known_hosts || echo "StrictHostKeyChecking no" >> ~/.ssh/config
    - echo "SSH configured securely (key not logged)"
  script:
    - |
      ssh $VM_USER@$VM_HOST << EOF
        sudo mkdir -p /var/www/html/devops-fe
        sudo chown -R centos:centos /var/www/html/devops-fe
      EOF
    - echo "Copying built files to VM..."
    - rsync -avz --delete dist/ $VM_USER@$VM_HOST:/var/www/html/devops-fe/
    - |
      ssh $VM_USER@$VM_HOST << 'OUTER_EOF'
        set -e
        cat > /tmp/htaccess-temp << 'INNER_EOF'
      <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
      </IfModule>
      INNER_EOF
        sudo mv /tmp/htaccess-temp /var/www/html/devops-fe/.htaccess
        sudo chown -R apache:apache /var/www/html/devops-fe
        sudo chmod -R 755 /var/www/html/devops-fe
        if command -v getenforce &> /dev/null && [ "$(getenforce)" != "Disabled" ]; then
          echo "Fixing SELinux context..."
          sudo chcon -R -t httpd_sys_content_t /var/www/html/devops-fe
          sudo setsebool -P httpd_can_network_connect 1
        fi
        echo "Restarting Apache..."
        sudo systemctl restart httpd
        if ! sudo systemctl is-active --quiet httpd; then
          echo "Apache failed to start!"
          sudo systemctl status httpd
          exit 1
        fi
        echo "Frontend deployment completed successfully!"
      OUTER_EOF
  environment:
    name: production
    url: https://$VM_HOST
  only:
    - main
  dependencies:
    - build