image: golang:latest

stages:
  - security
  - test
  - build
  - build-image
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

secrets-detection:
  stage: security
  image: zricethezav/gitleaks:latest
  script:
    - echo "🔍 Scanning for secrets in codebase..."
    - gitleaks detect --source . --verbose --no-git --redact
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: "$CI_COMMIT_BRANCH =~ /^(develop|staging)$/"
  tags: []

format:
  stage: test
  script:
    - go fmt $(go list ./... | grep -v /vendor/)
    - go vet $(go list ./... | grep -v /vendor/)

test:
  stage: test
  services:
    - postgres:latest
  variables:
    POSTGRES_DB: postgres
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ""
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: "$DATABASE_URL"
  script:
    - go test -v -coverprofile=coverage.out ./...
    - echo "=== Coverage Summary ==="
    - go tool cover -func=coverage.out | tail -1
    - echo "=== End Coverage ==="
  coverage: '/\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week

compile:
  stage: build
  script:
    - mkdir -p mybinaries
    - go build -o mybinaries ./...
  artifacts:
    paths:
      - mybinaries

build-docker-image:
  stage: build-image
  image: quay.io/buildah/stable:latest
  before_script:
    - buildah login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building backend container image..."
    - buildah bud -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
    - echo "Pushing to GitLab Container Registry..."
    - buildah push $IMAGE_NAME:$IMAGE_TAG
    - buildah push $IMAGE_NAME:latest
    - echo "✅ Backend image pushed - $IMAGE_NAME:latest"
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk update && apk add openssh-client bash
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $VM_HOST >> ~/.ssh/known_hosts || echo "StrictHostKeyChecking no" >> ~/.ssh/config
    - echo "SSH configured securely (key not logged)"
  script:
    - scp mybinaries/devops-be $VM_USER@$VM_HOST:/home/$VM_USER/devops-be-new
    - |
      ssh $VM_USER@$VM_HOST << EOF
        set -e
        echo "Stopping service..."
        sudo systemctl stop devops-be || true
        echo "Moving new binary..."
        sudo mv /home/centos/devops-be-new /usr/local/bin/devops-be
        sudo chmod +x /usr/local/bin/devops-be
        echo "Fixing SELinux context..."
        sudo chcon -t bin_t /usr/local/bin/devops-be
        if [ ! -x /usr/local/bin/devops-be ]; then
          echo "Binary not found or not executable!"
          exit 1
        fi
        echo "Starting service..."
        sudo systemctl start devops-be
        sleep 2
        if ! sudo systemctl is-active --quiet devops-be; then
          echo "Service failed to start!"
          echo "Service status:"
          sudo systemctl status devops-be || true
          echo "Recent logs:"
          sudo journalctl -u devops-be -n 50 --no-pager
          exit 1
        fi
        sudo systemctl status devops-be
        echo "Deployment completed successfully!"
      EOF
  environment:
    name: production
    url: http://$VM_HOST:8080
  only:
    - main
  dependencies:
    - compile