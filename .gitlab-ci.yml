image: node:18-alpine

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/

build:
  stage: build
  script:
    - echo "Installing dependencies..."
    - npm ci
    - echo "Building application..."
    - npm run build
    - echo "Build completed successfully!"
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    # Install SSH client and dependencies
    - apk update && apk add openssh-client bash rsync
    # Setup SSH
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Add SSH private key (from GitLab CI/CD variable)
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    # Add VM to known hosts
    - ssh-keyscan -H $VM_HOST >> ~/.ssh/known_hosts || echo "StrictHostKeyChecking no" >> ~/.ssh/config
  script:
    # Create deployment directory on VM if it doesn't exist
    - |
      ssh $VM_USER@$VM_HOST << EOF
        sudo mkdir -p /var/www/html/devops-fe
        sudo chown -R centos:centos /var/www/html/devops-fe
      EOF
    # Copy built files to VM
    - echo "Copying built files to VM..."
    - rsync -avz --delete dist/ $VM_USER@$VM_HOST:/var/www/html/devops-fe/
    # Configure .htaccess and restart Apache
    - |
      ssh $VM_USER@$VM_HOST << 'EOF'
        set -e
        # Create .htaccess for Vue Router history mode
        sudo tee /var/www/html/devops-fe/.htaccess > /dev/null << 'HTACCESS_EOF'
        <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteBase /
          # Handle Vue Router history mode
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
        </IfModule>
        # Cache static assets
        <IfModule mod_expires.c>
          ExpiresActive On
          ExpiresByType image/jpg "access plus 1 year"
          ExpiresByType image/jpeg "access plus 1 year"
          ExpiresByType image/gif "access plus 1 year"
          ExpiresByType image/png "access plus 1 year"
          ExpiresByType image/svg+xml "access plus 1 year"
          ExpiresByType text/css "access plus 1 year"
          ExpiresByType application/javascript "access plus 1 year"
          ExpiresByType application/x-javascript "access plus 1 year"
          ExpiresByType font/woff "access plus 1 year"
          ExpiresByType font/woff2 "access plus 1 year"
        </IfModule>
        # Gzip compression
        <IfModule mod_deflate.c>
          AddOutputFilterByType DEFLATE text/plain
          AddOutputFilterByType DEFLATE text/html
          AddOutputFilterByType DEFLATE text/xml
          AddOutputFilterByType DEFLATE text/css
          AddOutputFilterByType DEFLATE application/xml
          AddOutputFilterByType DEFLATE application/xhtml+xml
          AddOutputFilterByType DEFLATE application/rss+xml
          AddOutputFilterByType DEFLATE application/javascript
          AddOutputFilterByType DEFLATE application/x-javascript
          AddOutputFilterByType DEFLATE application/json
        </IfModule>
        HTACCESS_EOF
        # Set proper permissions
        sudo chown -R apache:apache /var/www/html/devops-fe
        sudo chmod -R 755 /var/www/html/devops-fe
        # Fix SELinux context
        if command -v getenforce &> /dev/null && [ "$(getenforce)" != "Disabled" ]; then
          echo "Fixing SELinux context..."
          sudo chcon -R -t httpd_sys_content_t /var/www/html/devops-fe
          sudo setsebool -P httpd_can_network_connect 1
        fi
        # Test Apache configuration
        echo "Testing Apache configuration..."
        sudo apachectl configtest
        # Restart Apache
        echo "Restarting Apache..."
        sudo systemctl restart httpd
        # Check if Apache is running
        if ! sudo systemctl is-active --quiet httpd; then
          echo "❌ Apache failed to start!"
          sudo systemctl status httpd
          exit 1
        fi
        echo "✅ Frontend deployment completed successfully!"
      EOF
  environment:
    name: production
    url: https://$VM_HOST
  only:
    - main
  dependencies:
    - build