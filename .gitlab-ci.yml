image: golang:latest

stages:
  - security
  - test
  - build
  - build-image
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

secrets-detection:
  stage: security
  image: zricethezav/gitleaks:latest
  script:
    - echo "🔍 Scanning for secrets in codebase..."
    - gitleaks detect --source . --verbose --no-git --redact
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: "$CI_COMMIT_BRANCH =~ /^(develop|staging)$/"
  tags: []

format:
  stage: test
  script:
    - go fmt $(go list ./... | grep -v /vendor/)
    - go vet $(go list ./... | grep -v /vendor/)

test:
  stage: test
  services:
    - postgres:latest
  variables:
    POSTGRES_DB: postgres
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ""
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: "$DATABASE_URL"
  script:
    - go test -v -coverprofile=coverage.out ./...
    - echo "=== Coverage Summary ==="
    - go tool cover -func=coverage.out | tail -1
    - echo "=== End Coverage ==="
  coverage: '/\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week

compile:
  stage: build
  script:
    - mkdir -p mybinaries
    - go build -o mybinaries ./...
  artifacts:
    paths:
      - mybinaries

build-docker-image:
  stage: build-image
  image: quay.io/buildah/stable:latest
  before_script:
    - buildah login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building backend container image..."
    - buildah bud -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
    - echo "Pushing to GitLab Container Registry..."
    - buildah push $IMAGE_NAME:$IMAGE_TAG
    - buildah push $IMAGE_NAME:latest
    - echo "✅ Backend image pushed - $IMAGE_NAME:latest"
  only:
    - main

deploy-to-k8s:
  stage: deploy
  image: bitnami/kubectl:latest
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
  script:
    - echo "Deploying to Kubernetes namespace emzops-staging..."
    - kubectl apply -f k8s/configmap.yaml
    - kubectl apply -f k8s/rbac.yaml
    - kubectl apply -f k8s/postgres-statefulset.yaml
    - kubectl apply -f k8s/deployment.yaml
    - kubectl apply -f k8s/service.yaml
    - kubectl apply -f k8s/ingress.yaml
    - echo "Waiting for deployment to be ready..."
    - kubectl rollout status deployment/devops-backend -n emzops-staging --timeout=5m
    - echo "✅ Deployment successful!"
    - kubectl get pods -n emzops-staging
  environment:
    name: staging
    url: https://devops-mezdit.kubernetes.devops.cs.ut.ee
  only:
    - main