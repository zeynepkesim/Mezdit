image: node:22-alpine

stages:
  - security
  - build
  - build-image
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

secrets-detection:
  stage: security
  image: ghcr.io/gitleaks/gitleaks:latest  # Using GitHub Container Registry to avoid Docker Hub rate limits
  script:
    - echo "Scanning for secrets in frontend code..."
    - gitleaks detect --source . --verbose --no-git --redact
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: "$CI_COMMIT_BRANCH =~ /^(develop|staging)$/"
  tags: []

cache:
  paths:
    - node_modules/

build:
  stage: build
  script:
    - echo "Installing dependencies..."
    - npm ci
    - echo "Building application..."
    - npm run build
    - echo "Build completed successfully!"
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main

build-docker-image:
  stage: build-image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.0-debug
    entrypoint: [""]
  script:
    - echo "Building frontend container image with Kaniko..."
    - mkdir -p /kaniko/.docker
    # Configure both GitLab and Docker Hub registry authentication
    - |
      echo "{\"auths\":{
        \"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"},
        \"https://index.docker.io/v1/\":{\"auth\":\"$(printf "%s:%s" "${DOCKER_HUB_USER}" "${DOCKER_HUB_TOKEN}" | base64 | tr -d '\n')\"}
      }}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${IMAGE_NAME}:${IMAGE_TAG}"
      --destination "${IMAGE_NAME}:latest"
      --cache=true
      --cache-ttl=24h
    - echo "✅ Frontend image pushed - $IMAGE_NAME:latest"
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  only:
    - main

deploy-to-k8s:
  stage: deploy
  image: dtzar/helm-kubectl:latest
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
  script:
    - echo "Cleaning up legacy resources to avoid Helm conflicts..."
    - kubectl delete deployment devops-frontend -n emzops-staging --ignore-not-found
    - kubectl delete service devops-frontend-service -n emzops-staging --ignore-not-found
    - kubectl delete ingress devops-frontend-ingress -n emzops-staging --ignore-not-found
    - kubectl delete ingress devops-backend-ingress -n emzops-staging --ignore-not-found
    - kubectl delete configmap frontend-config -n emzops-staging --ignore-not-found
    - echo "Deploying to Kubernetes namespace emzops-staging using Helm..."
    - |
      helm upgrade --install devops-frontend ./chart \
        --namespace emzops-staging \
        --set image.tag=$IMAGE_TAG \
        --wait \
        --timeout 15m \
        --rollback-on-failure || \
      (echo "⚠️  First attempt failed (possibly due to lock), uninstalling stuck release..." && \
       helm uninstall devops-frontend --namespace emzops-staging --ignore-not-found || true && \
       sleep 5 && \
       echo "Retrying with fresh install..." && \
       helm install devops-frontend ./chart \
         --namespace emzops-staging \
         --create-namespace \
         --set image.tag=$IMAGE_TAG \
         --wait \
         --timeout 15m)
    - echo "✅ Deployment successful!"
    - kubectl get pods -n emzops-staging -l app=devops-frontend
  environment:
    name: staging
    url: https://devops-mezdit.kubernetes.devops.cs.ut.ee
  only:
    - main
