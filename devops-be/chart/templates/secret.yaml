apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  {{- if and .Values.postgres.enabled (not .Values.secrets.backend.databaseUrl) }}
  # Auto-generate DATABASE_URL if PostgreSQL is enabled and no explicit URL provided
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres-service:5432/%s?sslmode=disable" .Values.secrets.postgres.username .Values.secrets.postgres.password .Release.Name .Values.postgres.dbName | b64enc | quote }}
  {{- else if .Values.secrets.backend.databaseUrl }}
  # Use explicit DATABASE_URL from CI/CD
  DATABASE_URL: {{ .Values.secrets.backend.databaseUrl | b64enc | quote }}
  {{- end }}
  MINIO_ENDPOINT: {{ .Values.secrets.backend.minioEndpoint | b64enc | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.backend.minioAccessKey | b64enc | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.backend.minioSecretKey | b64enc | quote }}
  MINIO_BUCKET_NAME: {{ .Values.secrets.backend.minioBucketName | b64enc | quote }}
  MINIO_USE_SSL: {{ .Values.secrets.backend.minioUseSSL | toString | b64enc | quote }}
  POSTGRES_USER: {{ .Values.secrets.postgres.username | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgres.password | b64enc | quote }}
